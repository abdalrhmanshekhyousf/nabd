# Nabd's API and database on Render (task 5.4). In the Render dashboard:
# New → Blueprint → this repository. Render creates the database and the
# API from this file; only CLIENT_URL (and the optional VAPID keys) are asked.
services:
  - type: web
    name: nabd-api
    runtime: node
    plan: free
    region: frankfurt
    # Dev dependencies are needed to build (TypeScript) and to seed (tsx).
    buildCommand: npm ci --include=dev && npm run build -w server
    # Every start: bring the database up to date, add the demo hospital if it
    # is not there yet (it is added once), then serve.
    startCommand: cd server && npx prisma migrate deploy && npm run db:seed && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: nabd-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # The address of the app on Vercel, e.g. https://nabd.vercel.app
      # (several separated by commas).
      - key: CLIENT_URL
        sync: false
      - key: SEED_PASSWORD
        value: Admin@12345
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@nabd.demo

databases:
  - name: nabd-db
    plan: free
    region: frankfurt
    databaseName: nabd
