<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#10223A" />
    <meta name="description" content="Nabd — hospital management platform" />
    <title>نبض · Nabd</title>
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      // The stored choice (light | dark | system) is managed by the theme switcher (task 1.10).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('nabd-theme') || 'system';
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
