<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#10223A" />
    <meta name="description" content="Nabd — hospital management platform" />
    <title>نبض · Nabd</title>
    <script>
      // Apply the saved theme and language before first paint, so dark mode has no
      // light flash and English opens left-to-right without a jump. Keys match
      // src/stores/themeStore.ts and src/i18n/index.ts.
      (function () {
        var theme = 'system';
        var lang = 'ar';
        try {
          theme = localStorage.getItem('nabd-theme') || 'system';
          lang = localStorage.getItem('nabd-lang') === 'en' ? 'en' : 'ar';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
